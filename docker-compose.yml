# ─────────────────────────────────────────────────────────────────────────────
# SECOND-STACK CONTRACT (PRE-PROD rehearsal finding)
#
# Every default below reproduces the historical single-stack behaviour EXACTLY,
# so an existing deployment sees no change. They exist so a SECOND, fully
# isolated stack can run on the same host — which is how the production
# bring-up is rehearsed, and how a staging box can sit beside production.
#
#   STACK_PREFIX       container-name prefix   (default digi-tax)
#   STACK_ENV_FILE     env file the services load  (default .env)
#   POSTGRES_HOST_PORT / REDIS_HOST_PORT / API_HOST_PORT / FRONTEND_PORT
#
# STACK_ENV_FILE is the load-bearing one: `container_name` ignores
# COMPOSE_PROJECT_NAME, and a hardcoded `env_file: .env` would have pointed a
# second stack's API at the FIRST stack's DATABASE_URL — i.e. a "throwaway"
# environment quietly writing to the real database. Always set BOTH
# `-p <project>` and STACK_ENV_FILE when starting a second stack.
# See docs/server_deploy_runbook.md § Second stack on one host.
# ─────────────────────────────────────────────────────────────────────────────
x-backend-common: &backend-common
  build:
    context: ../digi-tax-backend
    dockerfile: Dockerfile
    args:
      # Deploy-verification: baked into GET /health/version. The deploy exports
      # BACKEND_SHA=$(git -C ../digi-tax-backend rev-parse HEAD) before building.
      GIT_SHA: ${BACKEND_SHA:-unknown}
  env_file: ${STACK_ENV_FILE:-.env}
  networks:
    - digi-tax-network
  depends_on:
    - postgres
    - redis

services:
  postgres:
    image: postgres:16-alpine
    container_name: ${STACK_PREFIX:-digi-tax}-postgres
    env_file: ${STACK_ENV_FILE:-.env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:${POSTGRES_HOST_PORT:-5432}:5432"
    networks:
      - digi-tax-network
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER:-digitax} -d ${POSTGRES_DB:-digitax}",
        ]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: ${STACK_PREFIX:-digi-tax}-redis
    ports:
      - "127.0.0.1:${REDIS_HOST_PORT:-6379}:6379"
    networks:
      - digi-tax-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    <<: *backend-common
    container_name: ${STACK_PREFIX:-digi-tax}-api
    ports:
      - "${API_HOST_PORT:-8000}:8000"
    volumes:
      # STUFFID catalog drop-folder (see data/stuffid/README.md). Read-write:
      # the boot importer reads archives; the admin upload endpoint saves new
      # archives here so they survive container recreation and reuse one pipeline.
      - ./data/stuffid:/data/stuffid
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000"]
    healthcheck:
      test:
        ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health/check', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 5

  frontend:
    build:
      context: ../digi-tax-frontend
      dockerfile: Dockerfile
      network: host
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-/api/v1}
        # Deploy-verification: baked into /version.json (eyeball what's served).
        GIT_SHA: ${FRONTEND_SHA:-unknown}
        HTTP_PROXY: ${FRONTEND_BUILD_HTTP_PROXY:-}
        HTTPS_PROXY: ${FRONTEND_BUILD_HTTPS_PROXY:-}
        ALL_PROXY: ${FRONTEND_BUILD_ALL_PROXY:-}
        http_proxy: ${FRONTEND_BUILD_HTTP_PROXY:-}
        https_proxy: ${FRONTEND_BUILD_HTTPS_PROXY:-}
        all_proxy: ${FRONTEND_BUILD_ALL_PROXY:-}
    container_name: ${STACK_PREFIX:-digi-tax}-frontend
    env_file: ${STACK_ENV_FILE:-.env}
    environment:
      PORT: "3000"
    ports:
      - "${FRONTEND_PORT:-3000}:3000"
    networks:
      - digi-tax-network
    depends_on:
      - api


networks:
  digi-tax-network:
    driver: bridge

volumes:
  postgres_data:
